<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ffffff" />
<title>Skaner AI — Gemini</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f5f5f5; --bg3: #eeeeee;
    --text: #111111; --text2: #555555; --text3: #888888;
    --border: rgba(0,0,0,0.12);
    --accent: #1a73e8;
    --success-bg: #e6f4ea; --success-fg: #1e7e34;
    --warn-bg: #fff8e1; --warn-fg: #a05a00;
    --danger-bg: #fce8e6; --danger-fg: #c62828;
    --info-bg: #e8f0fe; --info-fg: #1558d6;
    --radius: 12px; --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --bg2: #2a2a2a; --bg3: #333333;
      --text: #f0f0f0; --text2: #aaaaaa; --text3: #777777;
      --border: rgba(255,255,255,0.1);
      --accent: #4da3ff;
      --success-bg: #1a3a22; --success-fg: #6fcf7a;
      --warn-bg: #2e2000; --warn-fg: #ffc04d;
      --danger-bg: #3a1010; --danger-fg: #ff6b6b;
      --info-bg: #0d1f3c; --info-fg: #80aaff;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; }
  #app { max-width: 480px; margin: 0 auto; padding: 1rem; }

  h1 { font-size: 18px; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
  h1 span.logo { font-size: 22px; }

  .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 12px; }
  .label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }

  input[type=password], input[type=text], textarea, select {
    width: 100%; padding: 9px 12px; font-size: 14px;
    background: var(--bg2); color: var(--text);
    border: 0.5px solid var(--border); border-radius: var(--radius-sm);
    outline: none; font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { min-height: 56px; resize: vertical; line-height: 1.5; }

  .row { display: flex; gap: 8px; align-items: center; }
  .row label { font-size: 13px; color: var(--text2); min-width: 72px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }

  video { width: 100%; border-radius: var(--radius-sm); background: #000; aspect-ratio: 4/3; object-fit: cover; display: block; }
  canvas { display: none; }

  .btn-row { display: flex; gap: 8px; }
  button { flex: 1; padding: 11px 0; font-size: 14px; font-weight: 600; border-radius: var(--radius-sm); cursor: pointer; border: none; font-family: inherit; transition: opacity 0.15s; }
  button:active { opacity: 0.75; }
  .btn-start { background: var(--accent); color: #fff; }
  .btn-stop { background: var(--danger-bg); color: var(--danger-fg); border: 0.5px solid var(--border); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
  .b-info { background: var(--info-bg); color: var(--info-fg); }
  .b-success { background: var(--success-bg); color: var(--success-fg); }
  .b-warn { background: var(--warn-bg); color: var(--warn-fg); }
  .b-danger { background: var(--danger-bg); color: var(--danger-fg); }

  #progress { height: 3px; background: var(--bg3); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  #pbar { height: 100%; width: 0%; background: var(--accent); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--bg2); border-radius: var(--radius-sm); padding: 10px 12px; }
  .stat-n { font-size: 22px; font-weight: 700; color: var(--text); }
  .stat-l { font-size: 12px; color: var(--text3); margin-top: 2px; }

  #answer-box { min-height: 80px; background: var(--bg2); border-radius: var(--radius-sm); padding: 12px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; color: var(--text); }

  .hint { font-size: 12px; color: var(--text3); margin-top: 5px; }
  .hint a { color: var(--accent); text-decoration: none; }

  .status-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }

  .snapshot { width: 100%; border-radius: var(--radius-sm); margin-top: 10px; display: none; }
</style>
</head>
<body>
<div id="app">
  <h1><span class="logo">📷</span> Skaner AI</h1>

  <div class="card">
    <div class="label">Klucz API OpenRouter (darmowy)</div>
    <input type="password" id="api-key" placeholder="sk-or-v1-..." autocomplete="off" />
    <div class="hint">Pobierz za darmo: <a href="https://openrouter.ai/settings/keys" target="_blank">openrouter.ai</a> → zaloguj przez Google → Create Key &nbsp;|&nbsp; darmowe modele bez limitu dziennego</div>
  </div>

  <div class="card">
    <div class="label">Pytanie do AI</div>
    <textarea id="question">Co widzisz na zdjęciu? Jeśli jest tekst, przepisz go dokładnie. Opisz też co to jest.</textarea>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:10px;">
      <label>Interwał</label>
      <input type="range" min="2" max="30" value="5" id="interval" />
      <span id="interval-out" style="font-size:13px;font-weight:600;min-width:28px;">5s</span>
    </div>
    <div class="row">
      <label>Kamera</label>
      <select id="cam-dir">
        <option value="environment">Tylna (główna)</option>
        <option value="user">Przednia (selfie)</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom:8px;">Podgląd kamery</div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <img id="snapshot" class="snapshot" alt="ostatnie zdjęcie" />
  </div>

  <div class="card">
    <div class="status-row">
      <span id="status-badge" class="badge b-info">Gotowy</span>
      <span id="next-badge" class="badge b-info" style="display:none;"></span>
    </div>
    <div class="btn-row">
      <button class="btn-start" id="start-btn" onclick="startScan()">▶ Start</button>
      <button class="btn-stop" id="stop-btn" onclick="stopScan()" style="display:none;">■ Stop</button>
    </div>
    <div id="progress"><div id="pbar"></div></div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="stat-n" id="scan-count">0</div><div class="stat-l">Skanów</div></div>
      <div class="stat"><div class="stat-n" id="remain">∞</div><div class="stat-l">Limit dzienny</div></div>
    </div>
    <div class="label" style="margin-bottom:6px;">Odpowiedź AI</div>
    <div id="answer-box">Tutaj pojawi się odpowiedź...</div>
  </div>
</div>

<script>
let stream = null, intervalId = null, scanning = false;
let scanCount = 0, usedToday = 0;
let countdownTimer = null, progressTimer = null;

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const snapshot = document.getElementById('snapshot');

document.getElementById('interval').oninput = function() {
  document.getElementById('interval-out').textContent = this.value + 's';
};

async function startCamera() {
  const facing = document.getElementById('cam-dir').value;
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
  } catch(e) {
    setStatus('Brak dostępu do kamery', 'danger');
    document.getElementById('answer-box').textContent = '❌ Nie można uruchomić kamery. Upewnij się że strona ma uprawnienia.';
  }
}

startCamera();
document.getElementById('cam-dir').onchange = startCamera;

function captureBase64() {
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  ctx.drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
  snapshot.src = dataUrl;
  snapshot.style.display = 'block';
  return dataUrl.split(',')[1];
}

async function queryGemini(base64img) {
  const key = document.getElementById('api-key').value.trim();
  const question = document.getElementById('question').value.trim();
  if (!key) throw new Error('Wpisz klucz API OpenRouter');

  const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${key}`,
      'HTTP-Referer': window.location.href,
      'X-Title': 'Skaner AI'
    },
    body: JSON.stringify({
      model: 'openrouter/free',
      max_tokens: 512,
      messages: [{
        role: 'user',
        content: [
          { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${base64img}` } },
          { type: 'text', text: question }
        ]
      }]
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || 'Błąd API ' + res.status);
  }
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '(brak odpowiedzi)';
}

function setStatus(text, type) {
  const b = document.getElementById('status-badge');
  b.textContent = text;
  b.className = 'badge b-' + type;
}

function animateProgress(secs) {
  const bar = document.getElementById('pbar');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  void bar.offsetWidth;
  bar.style.transition = `width ${secs}s linear`;
  bar.style.width = '100%';
}

function resetProgress() {
  const bar = document.getElementById('pbar');
  bar.style.transition = 'none';
  bar.style.width = '0%';
}

async function doScan() {
  setStatus('Robię zdjęcie...', 'warn');
  let img;
  try { img = captureBase64(); } catch(e) { setStatus('Błąd kamery', 'danger'); return; }

  setStatus('Pytam AI...', 'warn');
  try {
    const answer = await queryGemini(img);
    scanCount++;
    usedToday++;
    document.getElementById('scan-count').textContent = scanCount;
    document.getElementById('remain').textContent = '∞';
    document.getElementById('answer-box').textContent = answer;
    setStatus('Gotowe ✓', 'success');

    const secs = parseInt(document.getElementById('interval').value);
    animateProgress(secs);

    const badge = document.getElementById('next-badge');
    badge.style.display = '';
    let cd = secs;
    badge.textContent = 'Następny za ' + cd + 's';
    clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
      cd--;
      badge.textContent = cd > 0 ? 'Następny za ' + cd + 's' : 'Skanuję...';
      if (cd <= 0) clearInterval(countdownTimer);
    }, 1000);
  } catch(e) {
    document.getElementById('answer-box').textContent = '❌ ' + e.message;
    setStatus('Błąd', 'danger');
  }
}

async function startScan() {
  if (scanning) return;
  if (!document.getElementById('api-key').value.trim()) {
    setStatus('Wpisz klucz API!', 'danger');
    return;
  }
  scanning = true;
  document.getElementById('start-btn').style.display = 'none';
  document.getElementById('stop-btn').style.display = '';

  await doScan();
  const secs = parseInt(document.getElementById('interval').value);
  intervalId = setInterval(() => { if (scanning) doScan(); }, secs * 1000);
}

function stopScan() {
  scanning = false;
  clearInterval(intervalId);
  clearInterval(countdownTimer);
  resetProgress();
  document.getElementById('start-btn').style.display = '';
  document.getElementById('stop-btn').style.display = 'none';
  document.getElementById('next-badge').style.display = 'none';
  setStatus('Zatrzymano', 'info');
}
</script>
</body>
</html>
